<article class="product-card">
  <a [routerLink]="['/products', product().id]" class="product-card-media">
    @if (coverImage()) {
      <img [src]="coverImage()" [alt]="product().name" loading="lazy" />
    } @else {
      <div class="product-card-placeholder" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="m3 15 5-5 4 4 3-3 6 6" />
          <circle cx="9" cy="8.5" r="1.5" />
        </svg>
      </div>
    }

    @if (!inStock()) {
      <span class="product-card-flag">Agotado</span>
    }

    @if (showFavorite()) {
      <button
        type="button"
        class="favorite-toggle"
        [class.active]="isFavorite()"
        [attr.aria-pressed]="isFavorite()"
        [attr.aria-label]="isFavorite() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
        (click)="onToggleFavorite($event)"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" [attr.fill]="isFavorite() ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
          <path d="M12 21s-6.7-4.35-9.33-8.14C1.02 10.6 1.6 7.2 4.6 5.8c2.1-1 4.4-.3 5.7 1.4l1.7 2.2 1.7-2.2c1.3-1.7 3.6-2.4 5.7-1.4 3 1.4 3.58 4.8 1.93 7.06C18.7 16.65 12 21 12 21Z" />
        </svg>
      </button>
    }
  </a>

  <div class="product-card-body">
    <a [routerLink]="['/products', product().id]" class="product-card-name">
      {{ product().name }}
    </a>
    <span class="product-card-price">{{ product().price | currency }}</span>
  </div>
</article>
