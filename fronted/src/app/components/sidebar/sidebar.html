<aside class="filters">
  <h2 class="filters-title">Filtros</h2>

  <section class="filter-group">
    <button
      type="button"
      class="filter-group-header"
      [attr.aria-expanded]="!collapsed()"
      (click)="toggle()"
    >
      <span>{{ title() }}</span>
      <svg class="chevron" [class.up]="!collapsed()" viewBox="0 0 24 24" width="18" height="18"
           aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>

    @if (!collapsed()) {
      <ul class="filter-list">
        <li>
          <label class="filter-option">
            <input
              type="checkbox"
              [checked]="selectedCategoryId() === null"
              (change)="selectCategory.emit(null)"
            />
            <span>Todas</span>
          </label>
        </li>

        @for (category of categories(); track category.id) {
          <li>
            <label class="filter-option">
              <input
                type="checkbox"
                [checked]="selectedCategoryId() === category.id"
                (change)="onPick(category.id)"
              />
              <span>{{ category.name }}</span>
            </label>
          </li>
        }
      </ul>
    }
  </section>
</aside>
